name: Cleanup temporary phpBB 3.3 branch and release

on:
  push:
    paths:
      - '.github/workflows/cleanup-phpbb33.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove temporary 3.3 release and branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete 1.0.0-phpbb33 --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          git push origin --delete phpbb-3.3 || true

      - name: Remove cleanup workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/cleanup-phpbb33.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary phpBB 3.3 cleanup workflow"
          git push
