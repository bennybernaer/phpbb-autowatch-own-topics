name: Fix 1.0.1 release notes

on:
  push:
    paths:
      - '.github/workflows/fix-1.0.1-release-notes.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix release notes formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/notes.md <<'EOF'
          ## Fixed

          - Removes stale phpBB notifications when the related post is deleted.
          - Cleans reply, mention, quote, bookmark, forum-watch and post-approval notifications linked to the deleted post.
          - Also removes topic-level notifications when an entire topic is deleted.

          ## Requirements

          - phpBB 4.0.0 or newer
          - PHP 8.2 or newer
          EOF
          gh release edit 1.0.1 --notes-file /tmp/notes.md
